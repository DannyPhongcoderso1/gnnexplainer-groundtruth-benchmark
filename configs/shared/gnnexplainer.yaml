# Pilot defaults only. Values will be locked after benchmark validation.
explainer:
  algorithm: "PyG GNNExplainer"
  explanation_type: "model"
  task_level: "node"
  return_type: "raw"
  edge_mask_type: "object"
  node_mask_type: "common_attributes"
  epochs: 5
  learning_rate: 0.01
  seed: 42
  top_k_edges: 25
