evaluation:
  model: "GCN"
  explainer: "PGExplainer"
  dataset_artifact: "artifacts/data/ba_house.pt"
  checkpoint: "artifacts/checkpoints/ba_house_gcn_best.pt"
  train_targets: "configs/targets/pgexplainer_train_targets.csv"
  validation_targets: "configs/targets/pgexplainer_val_targets.csv"
  generated_train_targets_copy: "results/metrics/pgexplainer_train_targets.csv"
  generated_validation_targets_copy: "results/metrics/pgexplainer_val_targets.csv"
  test_targets: "results/metrics/explainer_test_targets.csv"
  candidate_edge_scope: "computation_subgraph"
  edge_ranking_metric_scope: "continuous_scores_over_full_candidate_edge_set"
  budget_protocol: "fixed_candidate_edge_ratio"
  selected_edge_ratio: 0.2
  rounding_rule: "ceil(candidate_edge_count * selected_edge_ratio), minimum 1"
  metrics:
    - edge_auroc
    - edge_ap
    - fid_plus
    - fid_minus
    - one_minus_fid_minus
    - remove_probability_delta
    - retain_probability_delta
    - sparsity
    - jaccard_stability
    - runtime
  runtime_fields:
    - explainer_training_runtime_seconds
    - explanation_inference_runtime_seconds
    - evaluation_runtime_seconds
  leakage_policy:
    exclude_frozen_test_targets_from_train: true
    exclude_frozen_test_targets_from_validation: true
  hyperparameter_policy:
    default_source: "paper_supplement"
    large_search_allowed: false
    validation_only_changes_allowed_for:
      - api_incompatibility
      - numerical_failure
      - zero_or_nan_masks
      - obvious_non_training
