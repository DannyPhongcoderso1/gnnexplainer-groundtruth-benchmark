# ShapeGGen GCN backbone configuration frozen before ShapeGGen XAI.
model:
  type: "GCN"
  convolution: "PyG GCNConv"
  hidden_channels: 32
  num_layers: 3
  dropout: 0.2
  cached: false
  seed: 42
training:
  learning_rate: 0.01
  weight_decay: 0.0005
  max_epochs: 300
  patience: 60
  device: "auto"
  class_weighting: true
checkpoint:
  monitor: "val_accuracy"
  mode: "max"
