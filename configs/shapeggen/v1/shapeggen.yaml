# Frozen official GraphXAI ShapeGGen protocol for the second synthetic benchmark.
# Graph and explanation generation are delegated to upstream GraphXAI.
dataset:
  metadata:
    dataset_name: "ShapeGGen"
    protocol_name: "THESIS_SHAPEGGEN_OFFICIAL_V1"
    upstream_project: "GraphXAI"
    upstream_repository: "https://github.com/mims-harvard/GraphXAI"
    upstream_commit: "a11e65ffbc4df737f35522a8accf2283a8aeaa37"
    upstream_license: "MIT"
    upstream_shape_ggen_source: "graphxai/datasets/shape_graph.py"
    upstream_import_path: "graphxai.datasets.shape_graph.ShapeGGen"
    historical_local_task21_commit: "e7d753361fbebc205aa574c62c2b2520cc93d61b"
    historical_local_task21_sha256: "ecf0975a1a38ed89225b91992331165b14879b943dc96360ca4406dbbaacc6ac"

  upstream_generator:
    model_layers: 3
    shape: "house"
    seed: 912
    make_explanations: true
    variant: 1
    num_subgraphs: 100
    prob_connection: 0.09
    subgraph_size: 13
    verify: true
    max_tries_verification: 15
    n_informative: 6
    class_sep: 0.5
    n_features: 10
    n_clusters_per_class: 2
    homophily_coef: null
    add_sensitive_feature: false
    attribute_sensitive_feature: false
    sens_attribution_noise: 0.25

  local_adapter:
    edge_representation: "directed_pyg_edge_index_with_reverse_entries_from_upstream_graph"
    ground_truth_storage: "target_specific_dense_masks_from_official_graphxai_explanations"
    feature_explanations_in_core_metrics: false
    split:
      method: "stratified_disjoint"
      seed: 912
      train_ratio: 0.6
      val_ratio: 0.2
      test_ratio: 0.2
